<style>
  /* Фирменный стиль Beauty Garden: зелёный визитки + золото логотипа (как на сайте SalonApp, docs/08_DESIGN.md) */
  :root {
    color-scheme: dark;
    --brand: #042b0c; --bg: #021f08; --surface: #0a3416; --surface-2: #103f1e; --border: #235a35;
    --hairline: rgb(216 170 92 / 22%); --gold-line: rgb(216 170 92 / 38%);
    --text: #f4eedd; --text-2: #b7c5b3;
    --gold: #d8aa5c; --gold-light: #e6d79e; --on-gold: #042b0c;
    --gold-foil: linear-gradient(135deg, #e6d79e 0%, #d8aa5c 55%, #c99a4a 100%);
    --success: #8ed3a2; --success-soft: #123f22; --danger: #ff9e8c; --danger-soft: #3f1b16;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 10px 28px rgb(0 0 0 / 22%);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased;
         padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  html { font-variant-numeric: lining-nums; } /* у Cormorant по умолчанию «старинные» цифры разной высоты */
  button { font-family: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold-light); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
           background: var(--brand); border-bottom: 1px solid var(--hairline); }
  .logo { display: block; flex: none; width: 38px; height: 38px; background: center / contain no-repeat; }
  h1 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .24em; color: var(--gold-light); }
  .lang { display: flex; border: 1px solid var(--gold-line); border-radius: 10px; overflow: hidden; }
  .lang button { border: 0; background: transparent; padding: 7px 11px; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--text-2); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--gold-foil); color: var(--on-gold); }

  main { padding: 8px 14px 16px; max-width: 560px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px 16px; margin: 12px 0; box-shadow: var(--shadow); }
  .title { font: 600 26px/1.1 var(--font-display); margin: 0 0 16px; color: var(--text); }
  .title::after { content: ''; display: block; width: 36px; height: 2px; margin-top: 8px; background: var(--gold); border-radius: 2px; }
  .caps { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--text-2); }
  .demo { text-align: center; font-size: 13px; color: var(--gold); border: 1px dashed var(--gold-line); border-radius: 12px; padding: 6px 10px; margin: 8px 0 0; }

  .monthbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
  .monthbar b { font: 600 22px var(--font-display); text-transform: capitalize; color: var(--gold-light); }
  .monthbar button { width: 46px; height: 46px; font-size: 22px; border-radius: 14px; border: 1px solid var(--gold-line); background: var(--surface); color: var(--gold); cursor: pointer; }

  label { display: block; margin-bottom: 14px; }
  label > span { display: block; margin-bottom: 6px; }
  input, select { display: block; width: 100%; font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--border);
                  border-radius: 12px; padding: 12px 14px; min-height: 50px; }
  input:focus, select:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgb(216 170 92 / 25%); }
  input[readonly] { color: var(--text-2); }
  ::placeholder { color: rgb(183 197 179 / 55%); }
  .row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }

  .btn { display: block; width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--gold-foil); color: var(--on-gold);
         font-weight: 700; font-size: 17px; letter-spacing: .02em; margin-top: 6px; cursor: pointer; box-shadow: 0 6px 18px rgb(216 170 92 / 18%); }
  .btn.big { min-height: 62px; font-size: 18px; }
  .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold-line); box-shadow: none; margin-top: 10px; }
  .btn.small { display: inline-block; width: auto; min-height: 40px; padding: 0 14px; font-size: 14px; margin: 0; }
  .btn:disabled, body.busy .btn { opacity: .45; cursor: default; }
  .or { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }

  .todaysched { display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); border: 1px solid var(--hairline);
                border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
  .todaysched b { font: 600 22px var(--font-display); color: var(--gold-light); font-variant-numeric: lining-nums tabular-nums; }
  .live { text-align: center; color: var(--gold); min-height: 22px; margin: 0 0 6px; }

  .calc { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--hairline); }
  .calc b { font: 600 22px var(--font-display); font-variant-numeric: lining-nums tabular-nums; }
  .bad { color: var(--danger) !important; } .good { color: var(--success) !important; }

  .hero { text-align: center; padding: 22px 16px; background: linear-gradient(160deg, var(--surface-2), var(--surface)); }
  .hero .big { font: 600 46px/1.05 var(--font-display); color: var(--gold-light); margin: 6px 0 4px; font-variant-numeric: lining-nums tabular-nums; }
  .hero .big small { font-size: 24px; color: var(--gold); margin: 0 6px 0 2px; }
  .hero .sub { color: var(--text-2); }

  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--hairline); }
  .list li:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .day { width: 50px; flex: none; text-align: center; border: 1px solid var(--gold-line); border-radius: 12px; padding: 4px 0; }
  .day .dow { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-2); }
  .day .dnum { display: block; font: 600 24px/1 var(--font-display); color: var(--gold-light); }
  .monthbar b, .day .dnum, .title { font-variant-numeric: lining-nums; } /* «font:» выше сбрасывает это свойство */
  .day.today { background: var(--gold-foil); border-color: transparent; }
  .day.today .dow, .day.today .dnum { color: var(--on-gold); }
  .time { font: 600 21px/1.2 var(--font-display); font-variant-numeric: lining-nums tabular-nums; color: var(--text); }
  .pill { flex: none; padding: 4px 10px; border-radius: 999px; background: var(--success-soft); color: var(--success); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .sub { color: var(--text-2); font-size: 13px; }
  .money { font: 600 19px var(--font-display); color: var(--gold-light); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
  .acts { display: flex; flex: none; }
  .icon { width: 42px; height: 42px; border: 0; background: transparent; cursor: pointer; color: var(--gold); border-radius: 10px; }
  .icon svg { width: 20px; height: 20px; }
  .empty { color: var(--text-2); text-align: center; margin: 6px 0; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 14px; padding: 12px; }
  .stat .v { font: 600 24px/1.15 var(--font-display); color: var(--gold-light); margin-top: 4px; font-variant-numeric: lining-nums tabular-nums; }
  .stat.wide { grid-column: 1 / -1; }
  .stat.wide .v { font-size: 32px; }
  .whead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .whead .title { margin: 0; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--gold-line); color: var(--gold); }
  .wbtns { display: flex; gap: 8px; margin-top: 12px; } .wbtns .btn { flex: 1; margin: 0; }
  .sched-row { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 10px; margin-bottom: 8px; }
  .sched-row b { color: var(--gold); font-size: 14px; letter-spacing: .08em; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; background: var(--brand); border-top: 1px solid var(--hairline);
        padding-bottom: env(safe-area-inset-bottom); }
  nav button { flex: 1; min-height: 66px; border: 0; background: none; color: var(--text-2); font-size: 12px; font-weight: 600; line-height: 1.2; padding: 8px 2px; cursor: pointer; position: relative; }
  nav button svg { display: block; width: 24px; height: 24px; margin: 0 auto 4px; }
  nav button[aria-current="page"] { color: var(--gold); }
  nav button[aria-current="page"]::before { content: ''; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--gold); border-radius: 0 0 2px 2px; }

  #toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3; background: var(--surface-2);
           border: 1px solid var(--gold-line); color: var(--text); padding: 11px 16px; border-radius: 14px; font-size: 15px; opacity: 0;
           pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; box-shadow: var(--shadow); }
  #toast.show { opacity: 1; }
  .center { text-align: center; padding: 32px 8px; }
  .center .logo { width: 120px; height: 120px; margin: 0 auto 12px; }
  .center a { display: block; margin: 10px auto; max-width: 320px; text-decoration: none; text-align: center; line-height: 52px; }
</style>

const S = { lang: localStorage.getItem('bg_lang'), me: null, today: '', prices: [], schedule: {}, month: '', data: null, tab: '', edit: null, busy: false };
const t = (k, p) => { let s = T[S.lang || 'uk'][k] ?? T.uk[k] ?? k; for (const x in p || {}) s = s.replace('{' + x + '}', p[x]); return s; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const loc = () => (S.lang === 'pl' ? 'pl-PL' : 'uk-UA');
const fmt = (n) => Number(n || 0).toLocaleString(loc(), { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const zl = (n) => fmt(n) + ' zł';
// 10.5 → «10 год 30 хв»; big=true → разметка для крупного числа
function hh(n, big) {
  const m = Math.round(Number(n || 0) * 60), h = Math.floor(m / 60), mm = m % 60;
  if (big) return `${h}<small>${t('h')}</small>${mm ? `${mm}<small>${t('min')}</small>` : ''}`;
  return `${h} ${t('h')}${mm ? ` ${mm} ${t('min')}` : ''}`;
}
const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r2 = (n) => Math.round(n * 100) / 100;
const $ = (id) => document.getElementById(id);
const warsawToday = () => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Warsaw' }).format(new Date());
const hoursBetween = (a, b) => r2(((+b.slice(0, 2) * 60 + +b.slice(3, 5)) - (+a.slice(0, 2) * 60 + +a.slice(3, 5))) / 60);
const signed = (n) => (n > 0 ? '+' : '') + zl(n);
const dash = (s) => String(s).replace('-', ' – ');
const timeRange = (cell) => { const m = String(cell || '').match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/); return m ? [m[1].padStart(2, '0') + ':' + m[2], m[3].padStart(2, '0') + ':' + m[4]] : null; };
const schedFor = (date) => timeRange(S.schedule[DAYS[new Date(date + 'T12:00:00Z').getUTCDay()]]);

function dayBadge(date) {
  const dow = new Date(date + 'T12:00:00Z').toLocaleDateString(loc(), { weekday: 'short', timeZone: 'UTC' }).replace('.', '');
  return `<div class="day ${date === S.today ? 'today' : ''}"><span class="dow">${esc(dow)}</span><span class="dnum">${+date.slice(8, 10)}</span></div>`;
}

async function api(action, data = {}) {
  if (DEMO) return demoApi(action, JSON.parse(JSON.stringify(data)));
  let r;
  try {
    // text/plain — чтобы браузер не делал CORS preflight, который Apps Script не поддерживает
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, data, initData: tg.initData }) });
    r = await res.json();
  } catch (e) { throw new Error('network'); }
  if (!r.ok) throw new Error(r.error);
  return r.data;
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 3000);
}
const errText = (code) => (T.uk['err_' + code] ? t('err_' + code) : t('err_server'));
const confirmBox = (msg) => new Promise((ok) => (IN_TG && tg.showConfirm ? tg.showConfirm(msg, ok) : ok(confirm(msg))));

async function run(fn) {
  if (S.busy) return;
  S.busy = true; document.body.classList.add('busy');
  try { await fn(); } catch (e) { toast(errText(e.message)); } finally { S.busy = false; document.body.classList.remove('busy'); }
}

async function start() {
  if (tg) {
    tg.ready(); tg.expand();
    if (IN_TG && tg.isVersionAtLeast('6.1')) { tg.setHeaderColor('#042b0c'); tg.setBackgroundColor('#021f08'); }
    if (IN_TG && tg.isVersionAtLeast('7.10')) tg.setBottomBarColor('#042b0c');
  }
  renderLang();
  if (!IN_TG && !DEMO) return renderOutside();
  try {
    const init = await api('init');
    Object.assign(S, init);
    S.lang = S.lang || init.me.lang;

}

function updateShift() {
  const s = schedFor($('f_date').value || S.today);
  $('sched').textContent = s ? s.join(' – ') : t('dayOff');
  $('bySched').disabled = !s;
  const a = $('f_start').value, b = $('f_end').value;
  $('calcH').textContent = a && b && hoursBetween(a, b) > 0 ? hh(hoursBetween(a, b)) : '';
}

function updateCash() {
  const exp = r2(num($('f_cash').value) - num($('f_exp').value));
  const diff = r2(num($('f_actual').value) - exp);
  $('c_exp').textContent = zl(exp);
  $('c_diff').textContent = diff < 0 ? t('shortage') + ' ' + zl(diff) : diff > 0 ? t('surplus') + ' ' + signed(diff) : t('ok');
  $('c_diff').className = diff < 0 ? 'bad' : diff > 0 ? 'good' : '';
}

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-lang],button[data-tab],button[data-month],button[data-act]');
  if (!b || b.disabled) return;
  const ds = b.dataset;
  if (ds.lang) { S.lang = ds.lang; localStorage.setItem('bg_lang', S.lang); return S.me ? render() : (renderLang(), renderOutside()); }
  if (ds.tab) { S.tab = ds.tab; S.edit = null; return render(); }
  if (ds.month) {
    const [y, m] = S.month.split('-').map(Number), d = new Date(Date.UTC(y, m - 1 + Number(ds.month), 1));
    S.month = d.toISOString().slice(0, 7);
    return run(load);
  }
  const a = ds.act;
  if (a === 'cancel') { S.edit = null; return render(); }
  if (a === 'edit') { S.edit = { kind: ds.kind, ...S.data[ds.kind].find((r) => r.id === ds.id) }; render(); return scrollTo(0, 0); }
  if (a === 'addWorker') { S.edit = { kind: 'worker', isNew: true, schedule: {} }; render(); return scrollTo(0, 0); }
  if (a === 'editWorker') { S.edit = { kind: 'worker', ...S.data.staff.find((w) => w.name === ds.name) }; render(); return scrollTo(0, 0); }
  if (a === 'fireWorker' || a === 'restoreWorker') {
    if (a === 'fireWorker' && !(await confirmBox(t('confirmFire', { name: ds.name })))) return;
    return run(async () => { await api('setWorkerActive', { name: ds.name, active: a === 'restoreWorker' }); toast(t('saved')); await load(); });
  }
  if (a === 'del') {
    if (!(await confirmBox(t('confirmDelete')))) return;
    return run(async () => { await api('deleteRecord', { kind: ds.kind, id: ds.id }); S.edit = null; toast(t('deleted')); await load(); });
  }
  if (SAVE[a]) return run(async () => { await api(SAVE[a][0], SAVE[a][1]()); S.edit = null; toast(t('saved')); await load(); });
});

    let cashSum = 0, cardSum = 0, blikSum = 0, closer = null;
    for (const w of staff) {
      const s = timeRange(w.schedule[DAYS[d.getUTCDay()]]); if (!s || rnd() < 0.08) continue;
      const own = rnd() < 0.2; // иногда работала не по графику
      const a = s[0], b = own ? String(+s[1].slice(0, 2) - 1).padStart(2, '0') + ':30' : s[1];
      if (!(hoursBetween(a, b) > 0)) continue;
      db.shifts.push({ id: id(), date, name: w.name, start: a, end: b, hours: hoursBetween(a, b), bySchedule: own ? 'нет' : 'да', created });
      closer = closer || w.name;
      const hourly = w.type !== 'percent'; // почасовые клиенток не вносят, но выручку в кассу приносят
      for (let i = 0, k = (hourly ? 3 : 1) + Math.floor(rnd() * 4); i < k; i++) {
        const p = prices[Math.floor(rnd() * prices.length)];
        if (!hourly) db.services.push({ id: id(), date, name: w.name, service: p[0], price: p[1], materials: p[2], created });
        const r = rnd(); if (r < 0.35) cashSum += p[1]; else if (r < 0.85) cardSum += p[1]; else blikSum += p[1];
      }
    }
    if (!closer) continue;
    const expenses = rnd() < 0.25 ? 35 : 0, expected = cashSum - expenses, diff = rnd() < 0.15 ? -Math.round(rnd() * 30) : 0;
    db.cash.push({ id: id(), date, name: closer, cash: cashSum, card: cardSum, blik: blikSum, expenses, note: expenses ? 'kawa, ręczniki' : '',
      expected, actual: expected + diff, diff, created });
  }
  return db;
}

// Повторяет логику Code.gs, чтобы демо вело себя как настоящий сервер.
async function demoApi(action, d) {
  DB = DB || makeDemo();
  const owner = DEMO === 'owner';
  const name = owner ? 'Owner' : (DB.staff.some((w) => w.name === Q.get('name')) ? Q.get('name') : 'Anastasiia');
  const who = (n) => DB.staff.find((w) => w.name === n);
  const pay = (r, h, sv) => r2(r.type === 'hourly' ? h * r.rate : sv.reduce((s, x) => s + x.price, 0) * r.rate / 100);
  const sum = (l, k) => r2(l.reduce((s, x) => s + num(x[k]), 0));
  const can = (r) => owner || (r.name === name && r.created.slice(0, 10) === DB.today);
  const pub = (l) => l.slice().sort((a, b) => (a.date + a.created < b.date + b.created ? -1 : 1)).map((r) => ({ ...r, editable: can(r) }));
  const fail = (c) => { throw new Error(c); };
  const inM = (r) => r.date.slice(0, 7) === d.month;
  const okDate = (v) => (/^\d{4}-\d{2}-\d{2}$/.test(v) && v <= DB.today ? v : fail('bad_input'));
  const money = (v) => { const n = Number(String(v || 0).replace(',', '.')); return isFinite(n) && n >= 0 ? r2(n) : fail('bad_input'); };
  const upsert = (list, vals) => {
    const stamp = DB.today + ' ' + new Date().toTimeString().slice(0, 5);
    if (!d.id) return list.push({ id: 'd' + (++DB.n), name, created: stamp, ...vals });
    const r = list.find((x) => x.id === d.id) || fail('not_found');
    if (!can(r)) fail('edit_closed');
    Object.assign(r, vals, { updated: stamp });
  };
  switch (action) {
    case 'init': {
      const w = who(name) || {};
      return { me: { name, role: owner ? 'owner' : 'worker', lang: owner ? 'uk' : w.lang, type: w.type, rate: w.rate }, today: DB.today,
        prices: DB.prices.map((p) => ({ service: p[0], price: p[1] })), schedule: w.schedule || {} };
    }
    case 'myMonth': {
      const mine = (r) => r.name === name && inM(r);
      const sh = DB.shifts.filter(mine), sv = DB.services.filter(mine), h = sum(sh, 'hours');
      return { shifts: pub(sh), services: pub(sv), cash: pub(DB.cash.filter(mine)), totals: { hours: h, count: sv.length, sum: sum(sv, 'price'), pay: pay(who(name), h, sv) } };
    }
    case 'ownerMonth': {
      const cash = DB.cash.filter(inM);
      const tot = { cash: sum(cash, 'cash'), card: sum(cash, 'card'), blik: sum(cash, 'blik'), expenses: sum(cash, 'expenses'),
        shortage: r2(cash.reduce((s, c) => s + Math.min(0, c.diff), 0)), surplus: r2(cash.reduce((s, c) => s + Math.max(0, c.diff), 0)) };
      tot.revenue = r2(tot.cash + tot.card + tot.blik);
      const workers = DB.staff.filter((w) => w.active || DB.shifts.concat(DB.services).some((r) => r.name === w.name && inM(r))).map((w) => {
        const sv = DB.services.filter((r) => r.name === w.name && inM(r)), h = sum(DB.shifts.filter((r) => r.name === w.name && inM(r)), 'hours');
        return { name: w.name, type: w.type, rate: w.rate, hours: h, count: sv.length, sum: sum(sv, 'price'), pay: pay(w, h, sv) };
      });
      return { totals: tot, workers, cash: pub(cash), staff: DB.staff.map((w) => ({ ...w })) };
    }
    case 'saveShift': {
      const date = okDate(d.date);
      if (!/^\d{2}:\d{2}$/.test(d.start) || !/^\d{2}:\d{2}$/.test(d.end) || !(hoursBetween(d.start, d.end) > 0)) fail('bad_input');
      if (DB.shifts.some((r) => r.name === name && r.date === date && r.id !== d.id)) fail('shift_exists');
      return upsert(DB.shifts, { date, start: d.start, end: d.end, hours: hoursBetween(d.start, d.end), bySchedule: d.bySchedule ? 'да' : 'нет' });
    }
    case 'saveService': {
      const p = DB.prices.find((x) => x[0] === d.service) || fail('bad_input');
      return upsert(DB.services, { date: okDate(d.date), service: p[0], price: money(d.price), materials: p[2] });
    }
    case 'saveCash': {
      const date = okDate(d.date);
      if (DB.cash.some((r) => r.date === date && r.id !== d.id)) fail('cash_exists');
      const c = { date, cash: money(d.cash), card: money(d.card), blik: money(d.blik), expenses: money(d.expenses), note: String(d.note || '').slice(0, 200), actual: money(d.actual) };
      c.expected = r2(c.cash - c.expenses); c.diff = r2(c.actual - c.expected);
      return upsert(DB.cash, c);
    }
    case 'deleteRecord': {
      const list = DB[d.kind] || fail('bad_input'), i = list.findIndex((x) => x.id === d.id);
      if (i < 0) fail('not_found');
      if (!can(list[i])) fail('edit_closed');
      list.splice(i, 1); return true;
    }
    case 'saveWorker': {
      const nm = String(d.name || '').trim(), rate = money(d.rate), type = d.type === 'hourly' ? 'hourly' : 'percent';
      if (!nm || !(rate > 0) || (type === 'percent' && rate > 100) || (d.tgId && !/^\d{5,15}$/.test(d.tgId.trim()))) fail('bad_input');
      const schedule = {};
      for (const k of WEEK) { const v = String(d.schedule[k] || '').replace(/\s/g, '').replace(/[–—]/, '-'); if (v && !/^([01]\d|2[0-3]):[0-5]\d-([01]\d|2[0-3]):[0-5]\d$/.test(v)) fail('bad_input'); schedule[k] = v || 'выходной'; }
      const ex = who(nm);
      if (d.isNew && ex) fail('name_taken');
      if (d.tgId && DB.staff.some((w) => w.tgId === d.tgId.trim() && w.name !== nm)) fail('tg_taken');
      const vals = { tgId: d.tgId.trim(), lang: d.lang, type, rate, schedule };
      if (ex) Object.assign(ex, vals); else DB.staff.push({ name: nm, active: true, ...vals });
      return true;
    }
    case 'setWorkerActive': { (who(d.name) || fail('not_found')).active = !!d.active; return true; }
  }
  fail('bad_input');
}

start();
